name: Deploy Calculator to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Встановлення Docker та Docker Compose (якщо вони відсутні)
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
              sudo usermod -aG docker $USER
            fi

            # 2. Клонування або оновлення репозиторію
            if [ ! -d "projects-calc" ]; then
              git clone https://github.com/YulliaaaS/projects-calc.git ~/projects-calc
            fi
            cd ~/projects-calc
            git pull origin main

            # 3. Перезапуск контейнерів
            sudo docker compose down
            sudo docker compose build --no-cache
            sudo docker compose up -d